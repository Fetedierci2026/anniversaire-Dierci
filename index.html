<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anniversaire de Dierci 🎂</title>

<style>

body{

background:linear-gradient(135deg,#5a0000,#8b0000,#c00000);

font-family:Arial,sans-serif;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

margin:0;

}

.carte{

background:white;

padding:40px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.2);

text-align:center;

width:350px;

}

h1{

color:#FFD700;

text-shadow:0 0 10px gold;

font-size:40px;

}

input{

width:90%;

padding:12px;

font-size:18px;

border-radius:10px;

border:1px solid #ccc;

margin-top:20px;

}

button{

margin-top:20px;

padding:15px 35px;

font-size:20px;

background:#FFD700;

color:#7a0000;

border:none;

border-radius:12px;

cursor:pointer;

font-weight:bold;

box-shadow:0 0 20px gold;

transition:.3s;

}

button:hover{

transform:scale(1.08);

box-shadow:0 0 40px gold;

}

#resultat{

margin-top:30px;

font-size:22px;

font-weight:bold;

color:#444;

}

.ballon{

font-size:80px;

animation:tourner 5s linear infinite;

margin-bottom:20px;

}

@keyframes tourner{

0%{
transform:rotate(0deg);
}

100%{
transform:rotate(360deg);
}

}

.trophee{

font-size:70px;

margin-bottom:15px;

animation:rebond 2s infinite;

}

@keyframes rebond{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-12px);
}

}

</style>

</head>

<body>

<div class="carte">

<div class="ballon">⚽</div>

<div class="trophee">🏆</div>

<h1>🎂 Anniversaire de Dierci 🎉</h1>

<p>Entrez votre prénom pour trouver votre place.</p>

<input id="prenom" placeholder="Votre prénom">

<br>

<button onclick="chercher()">

Trouver ma place

</button>

<div id="resultat"></div>

</div>

<script>

function chercher(){

document.getElementById("resultat").innerHTML="🚧 Fonction bientôt disponible";

}

</script>

</body>

</html>
