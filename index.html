<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anniversaire de Dierci 🎂</title>

<style>

body{

background:linear-gradient(135deg,#5a0000,#8b0000,#c00000);

font-family:Arial,sans-serif;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

margin:0;

}

.carte{

background:white;

padding:40px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.2);

text-align:center;

width:350px;

position:relative;

z-index:2;

}

h1{

color:#FFD700;

text-shadow:0 0 10px gold;

font-size:40px;

}

input{

width:90%;

padding:12px;

font-size:18px;

border-radius:10px;

border:1px solid #ccc;

margin-top:20px;

}

button{

margin-top:20px;

padding:15px 35px;

font-size:20px;

background:#FFD700;

color:#7a0000;

border:none;

border-radius:12px;

cursor:pointer;

font-weight:bold;

box-shadow:0 0 20px gold;

transition:.3s;

}

button:hover{

transform:scale(1.08);

box-shadow:0 0 40px gold;

}

#resultat{

margin-top:30px;

font-size:22px;

font-weight:bold;

color:#444;

}

.ballon{

font-size:80px;

animation:tourner 5s linear infinite;

margin-bottom:20px;

}

@keyframes tourner{

0%{
transform:rotate(0deg);
}

100%{
transform:rotate(360deg);
}

}

.trophee{

font-size:70px;

margin-bottom:15px;

animation:rebond 2s infinite;

}

@keyframes rebond{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-12px);
}

}
.plan{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

margin-top:20px;

}

.table{

background:#ddd;

padding:20px;

border-radius:15px;

font-weight:bold;

transition:.4s;

}

.selectionnee{

background:#FFD700;

color:#7a0000;

font-weight:bold;

box-shadow:0 0 25px gold;

transform:scale(1.12);

animation:clignoter 1s infinite;

}


@keyframes clignoter{

0%{
box-shadow:0 0 10px gold;
}

50%{
box-shadow:0 0 30px orange;
}

100%{
box-shadow:0 0 10px gold;
}

}
  

.scene{

background:#FFD700;

color:#7a0000;

padding:10px;

border-radius:10px;

font-weight:bold;

margin-bottom:20px;

}

.entree{

margin-top:20px;

font-weight:bold;

color:#555;

}

.table{

background:#f4f4f4;

padding:20px;

border-radius:15px;

font-weight:bold;

transition:.4s;

cursor:pointer;

}

.table:hover{

transform:scale(1.05);

background:#eee;

}
  
#confettis{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
}

.confetti{
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    animation:tomber linear infinite;
}

@keyframes tomber{

    0%{
        transform:translateY(-20px) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }

}

  @keyframes succes {

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
        box-shadow:0 0 35px gold;
    }

    100%{
        transform:scale(1);
    }

}

.succes{
    animation:succes 0.8s ease;
}

  /* GALERIE PHOTO */

.galerie{

display:none;

margin-top:30px;

background:#fff;

padding:20px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}


.galerie h2{

color:#7a0000;

font-size:28px;

}


.grille-photos{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:12px;

}


.grille-photos img{

width:100%;

height:100px;

object-fit:cover;

border-radius:15px;

cursor:pointer;

transition:.3s;

}


.grille-photos img:hover{

transform:scale(1.08);

box-shadow:0 0 20px gold;

}


/* PHOTO EN GRAND */

.zoom{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.85);

justify-content:center;

align-items:center;

z-index:20;

}


.zoom img{

max-width:90%;

max-height:90%;

border-radius:20px;

}
  
</style>

</head>

<body>

<div id="confettis"></div>

<div class="carte">

<div class="ballon">⚽</div>

<div class="trophee">🏆</div>

<h1>🎂 Anniversaire de Dierci 🎉</h1>

<p>Entrez votre prénom pour trouver votre place.</p>

<input id="prenom" list="listeInvites" placeholder="Votre prénom">

<datalist id="listeInvites"></datalist>

<br>

<button onclick="chercher()">

Trouver ma place

</button>


<div class="zoom" id="zoom" onclick="fermerPhoto()">

<img id="photoZoom">

</div>

<div id="resultat"></div>

<div id="planSalle" style="display:none; margin-top:25px;">

<h2>🗺️ Plan de la salle</h2>

<div class="scene">🎂 SCÈNE</div>

<div class="plan">

<div class="table" id="table1">🍽️ Table 1</div>

<div class="table" id="table2">🍽️ Table 2</div>

<div class="table" id="table3">🍽️ Table 3</div>

<div class="table" id="table4">🍽️ Table 4</div>

</div>

<div class="entree">🚪 ENTRÉE</div>

<button onclick="ouvrirGalerie()">

📸 Galerie photo

</button>


<div class="galerie" id="galerie">

<h2>📸 Souvenirs de Dierci</h2>

<div class="grille-photos">

<<img src="IMG_1807.jpeg" alt="Photo 1">
<img src="IMG_1813.jpeg" alt="Photo 2">
<img src="IMG_1816.jpeg" alt="Photo 3">
<img src="IMG_1818.jpeg" alt="Photo 4">
<img src="IMG_1821.jpeg" alt="Photo 5">
<img src="IMG_1825.jpeg" alt="Photo 6">

</div>

</div>
  
</div>

</div>

<script>

const invites = {
  "Papa": { table: 1, place: 1 },
  "Maman": { table: 1, place: 2 },
  "Dierci": { table: 1, place: 3 },
  "Sarah": { table: 2, place: 1 },
  "Kevin": { table: 2, place: 2 },
  "Alex": { table: 3, place: 4 }
};

const liste = document.getElementById("listeInvites");

Object.keys(invites).forEach(function(nom){

    const option = document.createElement("option");

    option.value = nom;

    liste.appendChild(option);

});

const couleurs = [
    "#FFD700",
    "#FF0000",
    "#FFFFFF",
    "#FFA500"
];

const zoneConfettis = document.getElementById("confettis");

for(let i=0;i<80;i++){

    const c = document.createElement("div");

    c.className="confetti";

    c.style.left=Math.random()*100+"%";

    c.style.background=couleurs[Math.floor(Math.random()*couleurs.length)];

    c.style.animationDuration=(3+Math.random()*5)+"s";

    c.style.animationDelay=Math.random()*5+"s";

    c.style.width=(6+Math.random()*8)+"px";

    c.style.height=c.style.width;

    zoneConfettis.appendChild(c);

}

function chercher(){

    const prenom = document.getElementById("prenom").value.trim();

  const resultat = document.getElementById("resultat");

  const carte = document.querySelector(".carte");
  
    if(invites[prenom]){

        resultat.innerHTML = `
            <h2>🎉 Bienvenue ${prenom} !</h2>

            <p>🍽️ Table : <b>${invites[prenom].table}</b></p>

            <p>🪑 Place : <b>${invites[prenom].place}</b></p>
        `;
 
      document.getElementById("planSalle").style.display = "block";

      carte.classList.remove("succes");

setTimeout(function(){

    carte.classList.add("succes");

},10);
        document.querySelectorAll(".table").forEach(function(table){

            table.classList.remove("selectionnee");

        });

        document
        .getElementById("table" + invites[prenom].table)
        .classList.add("selectionnee");

    }else{

        resultat.innerHTML = "❌ Désolé, votre nom n'est pas dans la liste.";

        document.getElementById("planSalle").style.display = "none";

    }

}

 function ouvrirGalerie(){

document.getElementById("galerie").style.display="block";

}


document.querySelectorAll(".grille-photos img").forEach(function(photo){

photo.onclick=function(){

document.getElementById("photoZoom").src=this.src;

document.getElementById("zoom").style.display="flex";

}

});


function fermerPhoto(){

document.getElementById("zoom").style.display="none";

}
  
</script>

</body>

</html>
